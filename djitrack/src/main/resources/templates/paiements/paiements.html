<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Gestion des Paiements</title>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar (currentPage='paiements')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h4><i class="fas fa-credit-card me-2"></i>Gestion des Paiements</h4>
            <p>Consultez tous les paiements effectués par les abonnés</p>
        </div>
        <div class="header-actions">
            <div class="user-profile" onclick="window.location.href='/logout'">
                <div class="avatar">
                    <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">U</span>
                </div>
                <div class="user-info">
                    <div class="name" th:text="${#authentication.principal.username}">Utilisateur</div>
                    <div class="role" th:text="${#authentication.principal.authorities}">Rôle</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content-area">
        <!-- Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <h2 class="stat-number" id="totalPaiementsStat">0</h2>
                    <p class="stat-label">Total Paiements</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 class="stat-number" id="paiementsReussisStat">0</h2>
                    <p class="stat-label">Paiements Réussis</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon yellow">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h2 class="stat-number" id="paiementsEnAttenteStat">0</h2>
                    <p class="stat-label">En Attente</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon red">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <h2 class="stat-number" id="paiementsEchouesStat">0</h2>
                    <p class="stat-label">Échoués</p>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="mb-4">
            <button class="btn btn-outline-secondary" onclick="loadPaiements()">
                <i class="fas fa-sync-alt me-1"></i> Rafraîchir
            </button>
        </div>

        <!-- Historique des paiements -->
        <div class="data-card">
            <div class="card-header-custom">
                <h5><i class="fas fa-history me-2"></i>Historique des paiements</h5>
                <span class="text-muted" id="paiementCount">0 paiements</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                    <tr>
                        <th>Référence</th>
                        <th>Facture</th>
                        <th>Abonné</th>
                        <th>Montant</th>
                        <th>Mode</th>
                        <th>Date</th>
                        <th>Statut</th>
                    </tr>
                    </thead>
                    <tbody id="paiementsBody">
                    <tr>
                        <td colspan="7" class="text-center text-muted">
                            <div class="spinner-custom mx-auto"></div>
                            <span class="d-block mt-2">Chargement des paiements...</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<script>
    $(document).ready(function() {
        console.log('Page paiements chargée');
        loadPaiements();
        loadPaiementStats();
    });

    function loadPaiements() {
        console.log('Chargement des paiements...');

        $('#paiementsBody').html('<tr><td colspan="7" class="text-center text-muted"><div class="spinner-custom mx-auto"></div><span class="d-block mt-2">Chargement...</span></td></tr>');

        // Essayer d'abord l'API des paiements
        $.ajax({
            url: '/api/paiements',
            method: 'GET',
            success: function(data) {
                console.log('Paiements reçus:', data);
                var paiements = data || [];
                displayPaiements(paiements);
                updatePaiementStats(paiements);
            },
            error: function(xhr) {
                console.warn('API paiements non disponible, fallback sur les factures');
                // Fallback: utiliser les factures payées
                loadPaiementsFromFactures();
            }
        });
    }

    function loadPaiementsFromFactures() {
        $.ajax({
            url: '/api/factures',
            method: 'GET',
            success: function(data) {
                console.log('Factures reçues pour paiements:', data);
                var paiements = [];
                if (data && data.length > 0) {
                    data.forEach(function(facture) {
                        if (facture.statut === 'PAYEE') {
                            paiements.push({
                                reference: 'PAY-' + facture.id,
                                facture: facture,
                                montant: facture.montantTotal,
                                mode: 'ORANGE',
                                datePaiement: facture.dateEmission || new Date().toISOString().split('T')[0],
                                statut: 'REUSSI'
                            });
                        }
                    });
                }
                displayPaiements(paiements);
                updatePaiementStats(paiements);
            },
            error: function(xhr) {
                console.error('Erreur chargement factures:', xhr);
                var msg = 'Erreur de chargement';
                try {
                    var response = JSON.parse(xhr.responseText);
                    if (response.message) msg = response.message;
                    if (response.error) msg = response.error;
                } catch(e) {}
                $('#paiementsBody').html('<tr><td colspan="7" class="text-center text-danger">Erreur: ' + msg + '</td></tr>');
            }
        });
    }

    function displayPaiements(paiements) {
        $('#paiementCount').text(paiements.length + ' paiements');

        if (paiements.length === 0) {
            $('#paiementsBody').html('<tr><td colspan="7" class="text-center text-muted">Aucun paiement effectué</td></tr>');
            return;
        }

        var html = '';
        paiements.forEach(function(p) {
            var statusClass = '';
            var statusText = p.statut || 'EN ATTENTE';
            if (statusText === 'REUSSI' || statusText === 'PAYEE') {
                statusClass = 'payee';
            } else if (statusText === 'EN ATTENTE') {
                statusClass = 'en-attente';
            } else {
                statusClass = 'impayee';
            }

            var abonneNom = 'N/A';
            if (p.facture && p.facture.abonne && p.facture.abonne.utilisateur) {
                abonneNom = p.facture.abonne.utilisateur.nom;
            }

            html += '<tr>' +
                '<td><strong>' + (p.reference || 'N/A') + '</strong></td>' +
                '<td>' + (p.facture ? p.facture.numero : 'N/A') + '</td>' +
                '<td>' + abonneNom + '</td>' +
                '<td><strong>' + (p.montant ? p.montant.toLocaleString() + ' CFA' : '0 CFA') + '</strong></td>' +
                '<td>' + (p.mode || 'N/A') + '</td>' +
                '<td>' + (p.datePaiement ? (Array.isArray(p.datePaiement) ? p.datePaiement.join("-") : p.datePaiement) : "N/A") + '</td>' +
                '<td><span class="badge-status ' + statusClass + '">' + statusText + '</span></td>' +
            '</tr>';
        });

        $('#paiementsBody').html(html);
    }

    function loadPaiementStats() {
        $.ajax({
            url: '/api/factures/stats',
            method: 'GET',
            success: function(data) {
                if (data) {
                    $('#totalPaiementsStat').text(data.payees || 0);
                    $('#paiementsReussisStat').text(data.payees || 0);
                    $('#paiementsEnAttenteStat').text(data.enAttente || 0);
                    $('#paiementsEchouesStat').text(0);
                }
            },
            error: function() {
                $('#totalPaiementsStat').text(0);
                $('#paiementsReussisStat').text(0);
                $('#paiementsEnAttenteStat').text(0);
                $('#paiementsEchouesStat').text(0);
            }
        });
    }

    function updatePaiementStats(paiements) {
        var total = paiements.length;
        var reussis = paiements.filter(function(p) {
            return p.statut === 'REUSSI' || p.statut === 'PAYEE';
        }).length;
        var enAttente = paiements.filter(function(p) {
            return p.statut === 'EN ATTENTE';
        }).length;
        var echoues = paiements.filter(function(p) {
            return p.statut === 'ECHOUE' || p.statut === 'IMPAYEE';
        }).length;

        $('#totalPaiementsStat').text(total);
        $('#paiementsReussisStat').text(reussis);
        $('#paiementsEnAttenteStat').text(enAttente);
        $('#paiementsEchouesStat').text(echoues);
    }
</script>
</body>
</html>
