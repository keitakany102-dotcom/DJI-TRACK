<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Inscription')}">
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="bi bi-lightning-fill"></i>
            <h2>Inscription</h2>
            <p>Créez votre compte DjiTrack</p>
        </div>

        <form th:action="@{/api/auth/register}" method="post" id="registerForm">
            <div id="registerResult"></div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Nom complet</label>
                <input type="text" name="nom" class="form-control" placeholder="Votre nom" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input type="email" name="email" class="form-control" placeholder="exemple@email.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Téléphone</label>
                <input type="tel" name="telephone" class="form-control" placeholder="+225 XX XX XX XX" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mot de passe</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login w-100">
                <i class="bi bi-person-plus"></i> S'inscrire
            </button>
        </form>

        <div class="auth-footer">
            <p>Déjà inscrit ? <a href="/login">Se connecter</a></p>
        </div>
    </div>
</div>

<style>
    .auth-page {
        background: linear-gradient(135deg, #0d1117 0%, #1a1f2e 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
    }
    .auth-card {
        background: #fff;
        border-radius: 16px;
        padding: 48px 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .auth-brand {
        text-align: center;
        margin-bottom: 32px;
    }
    .auth-brand i {
        font-size: 3rem;
        color: #f0b429;
    }
    .auth-brand h2 {
        font-weight: 700;
        color: #0d1117;
        margin-top: 8px;
    }
    .auth-brand p {
        color: #6b7280;
        font-size: 0.95rem;
    }
    .form-control {
        padding: 12px 16px;
        border-radius: 10px;
    }
    .btn-login {
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        background: #0d1117;
        border: none;
    }
    .btn-login:hover {
        background: #1a1f2e;
    }
    .auth-footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: #6b7280;
    }
    .auth-footer a {
        color: #0d1117;
        font-weight: 600;
        text-decoration: none;
    }
    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>

<script>
    document.getElementById('registerForm')?.addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = {
            nom: formData.get('nom'),
            email: formData.get('email'),
            telephone: formData.get('telephone'),
            password: formData.get('password')
        };

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                document.getElementById('registerResult').innerHTML =
                    `<div class="alert alert-success">✅ Inscription réussie ! Redirection...</div>`;
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);
            } else {
                const error = await response.text();
                document.getElementById('registerResult').innerHTML =
                    `<div class="alert alert-danger">❌ ${error || 'Erreur lors de l\'inscription'}</div>`;
            }
        } catch (error) {
            document.getElementById('registerResult').innerHTML =
                `<div class="alert alert-danger">❌ Erreur de connexion</div>`;
        }
    });
</script>

<script th:replace="~{fragments/scripts :: scripts}"></script>
</body>
</html>
