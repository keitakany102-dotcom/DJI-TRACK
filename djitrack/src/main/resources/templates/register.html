<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Inscription')"></head>
<body class="auth-page">
<div class="auth-card" style="max-width:520px;">
    <div class="auth-logo">
        <div class="auth-logo-icon"><i class="bi bi-droplet-fill"></i></div>
        <div class="auth-logo-text">
            <div class="brand">Djitrack</div>
            <div class="subtitle">Gestion des eaux</div>
        </div>
    </div>

    <h2 class="auth-title">Créer un compte</h2>
    <p class="auth-subtitle">Remplissez le formulaire pour vous inscrire</p>

    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="row g-3 mb-1">
            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person-vcard me-1"></i> Nom</label>
                <input type="text" th:field="*{nom}" class="form-control" placeholder="Votre nom" required>
            </div>
            <div class="col-md-6">
                <label class="form-label"><i class="bi bi-person-vcard me-1"></i> Prénom</label>
                <input type="text" th:field="*{prenom}" class="form-control" placeholder="Votre prénom" required>
            </div>
        </div>
        <div class="mb-3 mt-3">
            <label class="form-label"><i class="bi bi-person me-1"></i> Nom d'utilisateur</label>
            <input type="text" th:field="*{username}" class="form-control" placeholder="Choisissez un identifiant" required>
        </div>
        <div class="mb-3">
            <label class="form-label"><i class="bi bi-envelope me-1"></i> Email</label>
            <input type="email" th:field="*{email}" class="form-control" placeholder="votre@email.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label"><i class="bi bi-lock me-1"></i> Mot de passe</label>
            <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="mb-4">
            <label class="form-label"><i class="bi bi-tag me-1"></i> Rôle</label>
            <select name="role" class="form-select" required>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">CLIENT</option>
            </select>
            <div class="form-text" style="font-size:0.78rem;color:#94a3b8;">
                Seul le rôle CLIENT est disponible pour l'inscription publique.
            </div>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2">
            <i class="bi bi-person-plus"></i> S'inscrire
        </button>
    </form>

    <div class="auth-divider"><span>ou</span></div>
    <p class="text-center mb-0" style="font-size:0.875rem;color:#64748b;">
        Déjà inscrit ?
        <a href="/login" class="fw-600" style="color:var(--primary);text-decoration:none;">Se connecter</a>
    </p>
</div>
</body>
</html>
