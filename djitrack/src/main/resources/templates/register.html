<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DjiTrack - Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
        }
        .auth-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .auth-brand { text-align: center; margin-bottom: 32px; }
        .auth-brand i { font-size: 3rem; color: #f0b429; }
        .auth-brand h2 { font-weight: 700; color: #0d1117; margin-top: 8px; }
        .auth-brand p { color: #6b7280; font-size: 0.95rem; }
        .form-control { padding: 12px 16px; border-radius: 10px; }
        .btn-register { padding: 12px; border-radius: 10px; font-weight: 600; background: #0d1117; border: none; color: #fff; width: 100%; }
        .btn-register:hover { background: #1a1f2e; color: #fff; }
        .btn-register:disabled { opacity: 0.7; }
        .alert { border-radius: 10px; }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #6b7280; }
        .auth-footer a { color: #0d1117; font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
        .role-option {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px; border: 2px solid #e5e7eb;
            border-radius: 10px; cursor: pointer; margin-bottom: 8px;
            transition: all 0.2s; user-select: none;
        }
        .role-option:hover { border-color: #9ca3af; background: #f9fafb; }
        .role-option.selected { border-color: #0d1117; background: #f3f4f6; }
        .role-badge { font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; color: #fff; font-weight: 600; white-space: nowrap; }
        .role-badge.admin { background: #dc2626; }
        .role-badge.agent { background: #2563eb; }
        .role-badge.abonne { background: #16a34a; }
        .role-desc { font-size: 0.8rem; color: #6b7280; margin-top: 1px; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-brand">
        <i class="bi bi-lightning-fill"></i>
        <h2>Créer un compte</h2>
        <p>Rejoignez DjiTrack</p>
    </div>

    <div id="registerResult"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label fw-semibold">Nom complet</label>
            <input type="text" id="nom" class="form-control" placeholder="Votre nom complet" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" id="email" class="form-control" placeholder="exemple@email.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Téléphone</label>
            <input type="tel" id="telephone" class="form-control" placeholder="+253 77 XX XX XX" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Mot de passe</label>
            <input type="password" id="password" class="form-control" placeholder="Minimum 6 caractères" required minlength="6">
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Type de compte</label>
            <div>
                <label class="role-option selected" id="opt-abonne">
                    <input type="radio" name="role" value="ROLE_ABONNE" checked style="display:none">
                    <span class="role-badge abonne">Abonné</span>
                    <div>
                        <div class="fw-semibold" style="font-size:0.9rem;">Abonné</div>
                        <div class="role-desc">Consulter vos factures et faire des réclamations</div>
                    </div>
                </label>
                <label class="role-option" id="opt-agent">
                    <input type="radio" name="role" value="ROLE_AGENT" style="display:none">
                    <span class="role-badge agent">Agent</span>
                    <div>
                        <div class="fw-semibold" style="font-size:0.9rem;">Agent</div>
                        <div class="role-desc">Créer des factures, gérer les abonnés, répondre aux réclamations</div>
                    </div>
                </label>
                <label class="role-option" id="opt-admin">
                    <input type="radio" name="role" value="ROLE_ADMIN" style="display:none">
                    <span class="role-badge admin">Administrateur</span>
                    <div>
                        <div class="fw-semibold" style="font-size:0.9rem;">Administrateur</div>
                        <div class="role-desc">Accès complet à toute la plateforme</div>
                    </div>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-register" id="registerBtn">
            <i class="bi bi-person-plus"></i> Créer mon compte
        </button>
    </form>

    <div class="auth-footer">
        <p>Déjà inscrit ? <a href="/login">Se connecter</a></p>
    </div>
</div>

<script>
    // Gestion des options de rôle
    let selectedRole = 'ROLE_ABONNE';
    document.querySelectorAll('.role-option').forEach(function(label) {
        label.addEventListener('click', function() {
            document.querySelectorAll('.role-option').forEach(l => l.classList.remove('selected'));
            this.classList.add('selected');
            selectedRole = this.querySelector('input[type=radio]').value;
        });
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const data = {
            nom: document.getElementById('nom').value.trim(),
            email: document.getElementById('email').value.trim(),
            telephone: document.getElementById('telephone').value.trim(),
            password: document.getElementById('password').value,
            role: selectedRole
        };

        const registerBtn = document.getElementById('registerBtn');
        const resultDiv = document.getElementById('registerResult');

        registerBtn.disabled = true;
        registerBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Création en cours...';
        resultDiv.innerHTML = '';

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include', // important : cookies de session
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();

                // Sauvegarder pour les appels API fetch
                localStorage.setItem('djitrack_token', result.token);
                localStorage.setItem('djitrack_role', result.role);
                localStorage.setItem('djitrack_email', result.email);
                localStorage.setItem('djitrack_nom', result.nom || '');

                resultDiv.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Compte créé ! Redirection vers votre tableau de bord...</div>';

                setTimeout(() => {
                    if (result.role === 'ROLE_ADMIN') {
                        window.location.replace('/dashboard/admin');
                    } else if (result.role === 'ROLE_AGENT') {
                        window.location.replace('/dashboard/agent');
                    } else {
                        window.location.replace('/dashboard/abonne');
                    }
                }, 1000);

            } else {
                let errorMsg = "Erreur lors de l'inscription";
                try { errorMsg = await response.text(); } catch(e) {}
                resultDiv.innerHTML = `<div class="alert alert-danger"><i class="bi bi-x-circle me-2"></i>${errorMsg}</div>`;
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Créer mon compte';
            }
        } catch (err) {
            resultDiv.innerHTML = '<div class="alert alert-danger"><i class="bi bi-wifi-off me-2"></i>Erreur de connexion au serveur</div>';
            registerBtn.disabled = false;
            registerBtn.innerHTML = '<i class="bi bi-person-plus"></i> Créer mon compte';
        }
    });
</script>
</body>
</html>
