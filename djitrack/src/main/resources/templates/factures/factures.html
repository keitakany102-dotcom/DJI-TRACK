<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Gestion des Factures</title>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar (currentPage='factures')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h4><i class="fas fa-file-invoice me-2"></i>Gestion des Factures</h4>
            <p>Consultez et gérez toutes les factures</p>
        </div>
        <div class="header-actions">
            <div class="user-profile" onclick="window.location.href='/logout'">
                <div class="avatar">
                    <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">U</span>
                </div>
                <div class="user-info">
                    <div class="name" th:text="${#authentication.principal.username}">Utilisateur</div>
                    <div class="role" th:text="${#authentication.principal.authorities}">Rôle</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content-area">
        <!-- Filters -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" class="form-control form-control-custom" id="searchFacture" placeholder="Rechercher par numéro ou abonné...">
                </div>
            </div>
            <div class="col-md-3">
                <select class="form-control form-control-custom" id="filterStatut">
                    <option value="all">Tous les statuts</option>
                    <option value="PAYEE">Payées</option>
                    <option value="EN ATTENTE">En attente</option>
                    <option value="IMPAYEE">Impayées</option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control form-control-custom" id="filterDate">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary-custom w-100" onclick="loadFactures()">
                    <i class="fas fa-filter me-1"></i> Filtrer
                </button>
            </div>
        </div>

        <!-- Bouton créer - Visible uniquement pour ADMIN et AGENT -->
        <div class="mb-4" th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''AGENT'')')}">
            <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createFactureModal">
                <i class="fas fa-plus me-1"></i> Nouvelle facture
            </button>
        </div>

        <!-- Stats -->
        <div class="row g-4 mb-4" id="statsRow">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-file-invoice"></i>
                    </div>
                    <h2 class="stat-number" id="totalFacturesStat">0</h2>
                    <p class="stat-label">Total factures</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 class="stat-number" id="payeesStat">0</h2>
                    <p class="stat-label">Payées</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon yellow">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h2 class="stat-number" id="attenteStat">0</h2>
                    <p class="stat-label">En attente</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon red">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h2 class="stat-number" id="impayeesStat">0</h2>
                    <p class="stat-label">Impayées</p>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="data-card">
            <div class="card-header-custom">
                <h5><i class="fas fa-list me-2"></i>Liste des factures</h5>
                <span class="text-muted" id="factureCount">0 factures</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                    <tr>
                        <th>N°</th>
                        <th>Abonné</th>
                        <th>Montant</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="facturesTableBody">
                    <tr>
                        <td colspan="6" class="text-center text-muted">
                            <div class="spinner-custom mx-auto"></div>
                            <span class="d-block mt-2">Chargement des factures...</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<!-- Modal Créer Facture - ADMIN et AGENT uniquement -->
<div class="modal fade" id="createFactureModal" tabindex="-1" th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''AGENT'')')}">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-file-invoice me-2"></i>Créer une nouvelle facture</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="factureForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Numéro de facture <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-custom" id="factureNumero" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Montant total <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-custom" id="factureMontant" step="0.01" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ID Abonné <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-custom" id="factureAbonneId" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date d'émission</label>
                            <input type="date" class="form-control form-control-custom" id="factureDate">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Statut</label>
                            <select class="form-control form-control-custom" id="factureStatut">
                                <option value="EN ATTENTE">En attente</option>
                                <option value="PAYEE">Payée</option>
                                <option value="IMPAYEE">Impayée</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary-custom" onclick="createFacture()">
                    <i class="fas fa-save me-1"></i> Créer la facture
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    var isAdminOrAgent = false;

    $(document).ready(function() {
        var authorities = '[[${#authentication.principal.authorities}]]';
        isAdminOrAgent = authorities.includes('ADMIN') || authorities.includes('AGENT');

        loadFactures();
        loadStats();

        $('#filterStatut').on('change', loadFactures);
        $('#filterDate').on('change', loadFactures);
        $('#searchFacture').on('keypress', function(e) {
            if (e.which === 13) loadFactures();
        });
    });

    function loadStats() {
        $.ajax({
            url: '/api/factures/stats',
            method: 'GET',
            success: function(data) {
                if (data) {
                    $('#totalFacturesStat').text(data.total || 0);
                    $('#payeesStat').text(data.payees || 0);
                    $('#attenteStat').text(data.enAttente || 0);
                    $('#impayeesStat').text(data.impayees || 0);
                }
            }
        });
    }

    function loadFactures() {
        var search = $('#searchFacture').val().trim();
        var statut = $('#filterStatut').val();
        var date = $('#filterDate').val();

        $.ajax({
            url: '/api/factures',
            method: 'GET',
            success: function(data) {
                var filtered = data || [];

                if (search) {
                    var s = search.toLowerCase();
                    filtered = filtered.filter(f =>
                        (f.numero && f.numero.toLowerCase().includes(s)) ||
                        (f.abonne && f.abonne.utilisateur && f.abonne.utilisateur.nom && f.abonne.utilisateur.nom.toLowerCase().includes(s))
                    );
                }

                if (statut !== 'all') {
                    filtered = filtered.filter(f => f.statut === statut);
                }

                if (date) {
                    filtered = filtered.filter(f => f.dateEmission === date);
                }

                $('#factureCount').text(filtered.length + ' factures');

                if (filtered.length === 0) {
                    $('#facturesTableBody').html('<tr><td colspan="6" class="text-center text-muted">Aucune facture trouvée</td></tr>');
                    return;
                }

                var html = '';
                filtered.forEach(function(f) {
                    var statusClass = '';
                    var statusText = f.statut || 'EN ATTENTE';
                    if (statusText === 'PAYEE') {
                        statusClass = 'payee';
                    } else if (statusText === 'EN ATTENTE') {
                        statusClass = 'en-attente';
                    } else {
                        statusClass = 'impayee';
                    }

                    var actions = '';
                    if (isAdminOrAgent) {
                        actions = '<button class="btn btn-sm btn-outline-primary me-1" onclick="editFacture(' + f.id + ')"><i class="fas fa-edit"></i></button>' +
                                  '<button class="btn btn-sm btn-outline-danger" onclick="deleteFacture(' + f.id + ')"><i class="fas fa-trash"></i></button>';
                    }

                    html += '<tr>' +
                        '<td><strong>' + (f.numero || 'N/A') + '</strong></td>' +
                        '<td>' + (f.abonne && f.abonne.utilisateur ? f.abonne.utilisateur.nom : 'N/A') + '</td>' +
                        '<td><strong>' + (f.montantTotal ? f.montantTotal.toLocaleString() + ' CFA' : '0 CFA') + '</strong></td>' +
                        '<td>' + (f.dateEmission || 'N/A') + '</td>' +
                        '<td><span class="badge-status ' + statusClass + '">' + statusText + '</span></td>' +
                        '<td>' + actions + '</td>' +
                    '</tr>';
                });

                $('#facturesTableBody').html(html);
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    $('#facturesTableBody').html('<tr><td colspan="6" class="text-center text-warning">Accès non autorisé</td></tr>');
                } else {
                    $('#facturesTableBody').html('<tr><td colspan="6" class="text-center text-danger">Erreur de chargement</td></tr>');
                }
            }
        });
    }

    function createFacture() {
        var numero = $('#factureNumero').val();
        var montant = $('#factureMontant').val();
        var abonneId = $('#factureAbonneId').val();
        var date = $('#factureDate').val() || new Date().toISOString().split('T')[0];
        var statut = $('#factureStatut').val();

        if (!numero || !montant || !abonneId) {
            alert('Veuillez remplir tous les champs obligatoires');
            return;
        }

        var data = {
            numero: numero,
            montantTotal: parseFloat(montant),
            dateEmission: date,
            statut: statut,
            abonne: { id: parseInt(abonneId) }
        };

        $.ajax({
            url: '/api/factures',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function() {
                alert('Facture créée avec succès');
                $('#createFactureModal').modal('hide');
                $('#factureForm')[0].reset();
                loadFactures();
                loadStats();
            },
            error: function(xhr) {
                alert('Erreur: ' + (xhr.responseText || 'Impossible de créer la facture'));
            }
        });
    }

    function editFacture(id) {
        alert('Fonctionnalité d\'édition en développement');
    }

    function deleteFacture(id) {
        if (confirm('Êtes-vous sûr de vouloir supprimer cette facture ?')) {
            $.ajax({
                url: '/api/factures/' + id,
                method: 'DELETE',
                success: function() {
                    alert('Facture supprimée');
                    loadFactures();
                    loadStats();
                },
                error: function(xhr) {
                    alert('Erreur: ' + (xhr.responseText || ''));
                }
            });
        }
    }
</script>
</body>
</html>
