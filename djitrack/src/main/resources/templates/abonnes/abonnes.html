<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Abonnés')}">
</head>
<body>
<!-- Sidebar conditionnelle -->
<div th:if="${#authentication.authorities.contains('ROLE_ADMIN')}">
    <div th:insert="~{fragments/sidebar-admin :: sidebar-admin}"></div>
</div>
<div th:elif="${#authentication.authorities.contains('ROLE_AGENT')}">
    <div th:insert="~{fragments/sidebar-agent :: sidebar-agent}"></div>
</div>
<!-- Dans toutes les pages -->
<div th:insert="~{fragments/sidebar-selector :: sidebar-selector}"></div>

<main class="main-content" id="mainContent">
    <header class="main-header">
        <div class="header-left">
            <button class="btn btn-toggle-sidebar" id="toggleSidebar">
                <i class="bi bi-list"></i>
            </button>
            <h4 class="page-title">Abonnés</h4>
        </div>
        <div class="header-right">
            <span class="badge bg-primary me-3" th:text="${#authentication.authorities.contains('ROLE_ADMIN')} ? 'Admin' : 'Agent'">Admin</span>
            <span class="user-email" th:text="${#authentication.name}">user@djitrack.com</span>
        </div>
    </header>

    <section class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Liste des abonnés</h4>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#abonneModal">
                <i class="bi bi-plus-circle"></i> Nouvel abonné
            </button>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="abonnesTable">
                        <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Téléphone</th>
                            <th>Adresse</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="abonnesTableBody">
                        <tr><td colspan="7" class="text-center text-muted">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Modal -->
<div class="modal fade" id="abonneModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nouvel abonné</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="abonneForm">
                    <div class="mb-2">
                        <label>Adresse</label>
                        <input type="text" name="adresse" class="form-control" required>
                    </div>
                    <div class="mb-2">
                        <label>ID Utilisateur</label>
                        <input type="number" name="utilisateurId" class="form-control" placeholder="ID de l'utilisateur" required>
                    </div>
                    <div id="abonneFormResult"></div>
                    <button type="submit" class="btn btn-primary w-100">Créer</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:replace="~{fragments/scripts :: scripts}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadAbonnes();
    });

    async function loadAbonnes() {
        try {
            const response = await fetch('/api/abonnes');
            const data = await response.json();
            const tbody = document.getElementById('abonnesTableBody');

            if (!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Aucun abonné</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.id || '-'}</td>
                    <td>${item.utilisateur?.nom || '-'}</td>
                    <td>${item.utilisateur?.email || '-'}</td>
                    <td>${item.utilisateur?.telephone || '-'}</td>
                    <td>${item.adresse || '-'}</td>
                    <td><span class="badge bg-success">Actif</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Load abonnes error:', error);
        }
    }

    document.getElementById('abonneForm')?.addEventListener('submit', async function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const data = {
            adresse: formData.get('adresse'),
            utilisateur: { id: parseInt(formData.get('utilisateurId')) }
        };

        try {
            const response = await fetch('/api/abonnes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                document.getElementById('abonneFormResult').innerHTML =
                    '<div class="alert alert-success">✅ Abonné créé avec succès</div>';
                this.reset();
                loadAbonnes();
                setTimeout(() => {
                    document.querySelector('#abonneModal .btn-close')?.click();
                }, 1500);
            } else {
                document.getElementById('abonneFormResult').innerHTML =
                    '<div class="alert alert-danger">❌ Erreur lors de la création</div>';
            }
        } catch (error) {
            document.getElementById('abonneFormResult').innerHTML =
                '<div class="alert alert-danger">❌ Erreur de connexion</div>';
        }
    });
</script>
</body>
</html>
