<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Gestion des Abonnés</title>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar (currentPage='abonnes')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h4><i class="fas fa-users me-2"></i>Gestion des Abonnés</h4>
            <p>Consultez et gérez tous les abonnés du service</p>
        </div>
        <div class="header-actions">
            <div class="user-profile" onclick="window.location.href='/logout'">
                <div class="avatar">
                    <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">U</span>
                </div>
                <div class="user-info">
                    <div class="name" th:text="${#authentication.principal.username}">Utilisateur</div>
                    <div class="role" th:text="${#authentication.principal.authorities}">Rôle</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content-area">
        <!-- Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-users"></i>
                    </div>
                    <h2 class="stat-number" id="totalAbonnes">0</h2>
                    <p class="stat-label">Total Abonnés</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-user-check"></i>
                    </div>
                    <h2 class="stat-number" id="abonnesActifs">0</h2>
                    <p class="stat-label">Abonnés Actifs</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon yellow">
                        <i class="fas fa-user-clock"></i>
                    </div>
                    <h2 class="stat-number" id="abonnesInactifs">0</h2>
                    <p class="stat-label">Abonnés Inactifs</p>
                </div>
            </div>
        </div>

        <!-- Search -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control form-control-custom" id="searchAbonne" placeholder="Rechercher un abonné par nom, email ou adresse...">
                    <button class="btn btn-primary-custom" onclick="loadAbonnes()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <button class="btn btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createAbonneModal">
                    <i class="fas fa-plus me-1"></i> Nouvel Abonné
                </button>
            </div>
        </div>

        <!-- Table -->
        <div class="data-card">
            <div class="card-header-custom">
                <h5><i class="fas fa-list me-2"></i>Liste des abonnés</h5>
                <span class="text-muted" id="abonneCount">0 abonnés</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Adresse</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="abonnesBody">
                    <tr>
                        <td colspan="7" class="text-center text-muted">
                            <div class="spinner-custom mx-auto"></div>
                            <span class="d-block mt-2">Chargement des abonnés...</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<!-- Modal Créer Abonné -->
<div class="modal fade" id="createAbonneModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Nouvel Abonné</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="abonneForm">
                    <div class="mb-3">
                        <label class="form-label">Nom complet <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-custom" id="abonneNom" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control form-control-custom" id="abonneEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Téléphone</label>
                        <input type="tel" class="form-control form-control-custom" id="abonneTelephone">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Adresse</label>
                        <input type="text" class="form-control form-control-custom" id="abonneAdresse">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe <span class="text-danger">*</span></label>
                        <input type="password" class="form-control form-control-custom" id="abonnePassword" required placeholder="Minimum 6 caractères">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary-custom" onclick="createAbonne()">
                    <i class="fas fa-save me-1"></i> Créer l'abonné
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        loadAbonnes();

        $('#searchAbonne').on('keypress', function(e) {
            if (e.which === 13) loadAbonnes();
        });
    });

    function loadAbonnes() {
        var search = $('#searchAbonne').val().trim();

        $.ajax({
            url: '/api/abonnes',
            method: 'GET',
            success: function(data) {
                var abonnes = data || [];

                if (search) {
                    var s = search.toLowerCase();
                    abonnes = abonnes.filter(a => {
                        var user = a.utilisateur || {};
                        return (user.nom && user.nom.toLowerCase().includes(s)) ||
                               (user.email && user.email.toLowerCase().includes(s)) ||
                               (a.adresse && a.adresse.toLowerCase().includes(s));
                    });
                }

                displayAbonnes(abonnes);

                // Stats
                $('#totalAbonnes').text(abonnes.length);
                // Pour les stats, on considère que tous sont actifs par défaut
                $('#abonnesActifs').text(abonnes.length);
                $('#abonnesInactifs').text(0);
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    $('#abonnesBody').html('<tr><td colspan="7" class="text-center text-warning">Accès non autorisé - Vous n\'avez pas les permissions nécessaires</td></tr>');
                } else {
                    $('#abonnesBody').html('<tr><td colspan="7" class="text-center text-danger">Erreur de chargement des abonnés</td></tr>');
                }
            }
        });
    }

    function displayAbonnes(abonnes) {
        $('#abonneCount').text(abonnes.length + ' abonnés');

        if (abonnes.length === 0) {
            $('#abonnesBody').html('<tr><td colspan="7" class="text-center text-muted">Aucun abonné trouvé</td></tr>');
            return;
        }

        var html = '';
        abonnes.forEach(function(a) {
            var user = a.utilisateur || {};
            var statusBadge = '<span class="badge-status actif"><i class="fas fa-circle me-1" style="font-size:8px;"></i>Actif</span>';

            html += '<tr>' +
                '<td>' + a.id + '</td>' +
                '<td><strong>' + (user.nom || 'N/A') + '</strong></td>' +
                '<td>' + (user.email || 'N/A') + '</td>' +
                '<td>' + (user.telephone || 'N/A') + '</td>' +
                '<td>' + (a.adresse || 'N/A') + '</td>' +
                '<td>' + statusBadge + '</td>' +
                '<td>' +
                    '<button class="btn btn-sm btn-outline-primary me-1" onclick="editAbonne(' + a.id + ')"><i class="fas fa-edit"></i></button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteAbonne(' + a.id + ')"><i class="fas fa-trash"></i></button>' +
                '</td>' +
            '</tr>';
        });

        $('#abonnesBody').html(html);
    }

    function createAbonne() {
        var nom = $('#abonneNom').val().trim();
        var email = $('#abonneEmail').val().trim();
        var telephone = $('#abonneTelephone').val().trim();
        var adresse = $('#abonneAdresse').val().trim();
        var password = $('#abonnePassword').val();

        if (!nom || !email || !password) {
            alert('Veuillez remplir tous les champs obligatoires');
            return;
        }

        if (password.length < 6) {
            alert('Le mot de passe doit contenir au moins 6 caractères');
            return;
        }

        // Créer d'abord l'utilisateur
        var userData = {
            nom: nom,
            email: email,
            telephone: telephone || '',
            password: password,
            role: 'ROLE_ABONNE'
        };

        $.ajax({
            url: '/admin/api/users',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(userData),
            success: function(response) {
                var userId = response.user ? response.user.id : null;
                if (userId) {
                    // Créer l'abonné
                    var abonneData = {
                        utilisateur: { id: userId },
                        adresse: adresse || ''
                    };

                    $.ajax({
                        url: '/api/abonnes',
                        method: 'POST',
                        contentType: 'application/json',
                        data: JSON.stringify(abonneData),
                        success: function() {
                            alert('Abonné créé avec succès');
                            $('#createAbonneModal').modal('hide');
                            $('#abonneForm')[0].reset();
                            loadAbonnes();
                        },
                        error: function() {
                            alert('Erreur lors de la création de l\'abonné');
                        }
                    });
                }
            },
            error: function(xhr) {
                alert('Erreur: ' + (xhr.responseText || 'Impossible de créer l\'utilisateur'));
            }
        });
    }

    function editAbonne(id) {
        alert('Fonctionnalité d\'édition en développement');
    }

    function deleteAbonne(id) {
        if (confirm('Êtes-vous sûr de vouloir supprimer cet abonné ?')) {
            $.ajax({
                url: '/api/abonnes/' + id,
                method: 'DELETE',
                success: function() {
                    alert('Abonné supprimé avec succès');
                    loadAbonnes();
                },
                error: function(xhr) {
                    alert('Erreur: ' + (xhr.responseText || ''));
                }
            });
        }
    }
</script>
</body>
</html>
