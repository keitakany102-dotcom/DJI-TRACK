<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Nouvelle réclamation')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="main-wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <main>
        <div class="page-header fade-up">
            <div>
                <h1 class="page-title"><i class="bi bi-chat-dots"></i> Nouvelle réclamation</h1>
                <div class="breadcrumb-custom"><i class="bi bi-house"></i> Mon espace &rsaquo; Réclamation</div>
            </div>
            <a th:href="@{/client/dashboard}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="card fade-up" style="max-width:680px;">
            <div class="card-header"><i class="bi bi-chat-square-text"></i> Formulaire de réclamation</div>
            <div class="card-body">
                <form th:action="@{/client/reclamations/save}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Type de réclamation *</label>
                        <select name="type" class="form-select" required>
                            <option value="" disabled selected>-- Choisissez un type --</option>
                            <option value="FUITE">💧 Fuite d'eau</option>
                            <option value="FACTURE_ELEVEE">🧾 Facture élevée</option>
                            <option value="ABSENCE_EAU">🚱 Absence d'eau</option>
                            <option value="MAUVAISE_PRESSION">📉 Mauvaise pression</option>
                            <option value="COMPTEUR_BLOQUE">🔒 Compteur bloqué</option>
                            <option value="DEMANDE_INFO">ℹ️ Demande d'information</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description *</label>
                        <textarea name="description" class="form-control" rows="5" required
                                  placeholder="Décrivez votre problème en détail…"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Priorité</label>
                        <div class="d-flex gap-2">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="priorite" value="BASSE" id="prioBasse">
                                <label class="form-check-label" for="prioBasse">🟢 Basse</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="priorite" value="MOYENNE" id="prioMoyenne" checked>
                                <label class="form-check-label" for="prioMoyenne">🟡 Moyenne</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="priorite" value="HAUTE" id="prioHaute">
                                <label class="form-check-label" for="prioHaute">🔴 Haute</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Photos (optionnel)</label>
                        <input type="file" name="photos" class="form-control" multiple accept="image/*">
                        <div class="form-text">Vous pouvez joindre plusieurs photos pour illustrer votre problème</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> Envoyer la réclamation
                        </button>
                        <a th:href="@{/client/dashboard}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
