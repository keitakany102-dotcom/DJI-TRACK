<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Rapports')}">
</head>
<body>
<div th:replace="${#authentication.authorities.contains('ROLE_ADMIN')} ? ~{fragments/sidebar-admin :: sidebar-admin} : ~{fragments/sidebar-agent :: sidebar-agent}"></div>
<!-- Dans toutes les pages -->
<div th:insert="~{fragments/sidebar-selector :: sidebar-selector}"></div>
<main class="main-content" id="mainContent">
    <header class="main-header">
        <div class="header-left">
            <button class="btn btn-toggle-sidebar" id="toggleSidebar">
                <i class="bi bi-list"></i>
            </button>
            <h4 class="page-title">Rapports</h4>
        </div>
        <div class="header-right">
            <span class="badge bg-primary me-3" th:text="${#authentication.authorities.contains('ROLE_ADMIN')} ? 'Admin' : 'Agent'">Admin</span>
            <span class="user-email" th:text="${#authentication.name}">user@djitrack.com</span>
        </div>
    </header>

    <section class="content">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Gestion des rapports</h4>
            <button class="btn btn-primary" id="generateReportBtn">
                <i class="bi bi-file-earmark-bar-graph"></i> Générer un rapport
            </button>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-12" id="reportMessage"></div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="rapportsTable">
                        <thead>
                        <tr>
                            <th>#ID</th>
                            <th>Type</th>
                            <th>Date génération</th>
                            <th>Contenu</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="rapportsTableBody">
                        <tr><td colspan="5" class="text-center text-muted">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>

<script th:replace="~{fragments/scripts :: scripts}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadRapports();
    });

    async function loadRapports() {
        try {
            const response = await fetch('/api/rapports');
            const data = await response.json();
            const tbody = document.getElementById('rapportsTableBody');

            if (!Array.isArray(data) || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Aucun rapport</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => `
                <tr>
                    <td>${item.id || '-'}</td>
                    <td><span class="badge bg-secondary">${item.type || '-'}</span></td>
                    <td>${item.dateGeneration ? new Date(item.dateGeneration).toLocaleDateString('fr-FR') : '-'}</td>
                    <td>${item.contenu || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="downloadReport(${item.id})">
                            <i class="bi bi-download"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteReport(${item.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Load rapports error:', error);
        }
    }

    document.getElementById('generateReportBtn')?.addEventListener('click', async function() {
        const msg = document.getElementById('reportMessage');
        try {
            const response = await fetch('/api/rapports/generer', {
                method: 'POST'
            });

            if (response.ok) {
                msg.innerHTML = '<div class="alert alert-success">✅ Rapport généré avec succès</div>';
                loadRapports();
                setTimeout(() => {
                    msg.innerHTML = '';
                }, 5000);
            } else {
                msg.innerHTML = '<div class="alert alert-danger">❌ Erreur lors de la génération</div>';
            }
        } catch (error) {
            msg.innerHTML = '<div class="alert alert-danger">❌ Erreur de connexion</div>';
        }
    });

    async function downloadReport(id) {
        try {
            // Implémenter le téléchargement du rapport
            alert(`Téléchargement du rapport #${id} (à implémenter)`);
        } catch (error) {
            console.error('Download error:', error);
        }
    }

    async function deleteReport(id) {
        if (!confirm('Voulez-vous supprimer ce rapport ?')) return;
        try {
            const response = await fetch(`/api/rapports/${id}`, {
                method: 'DELETE'
            });
            if (response.ok) {
                loadRapports();
            }
        } catch (error) {
            console.error('Delete error:', error);
        }
    }
</script>
</body>
</html>
