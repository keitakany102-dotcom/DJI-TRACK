<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Gestion des Relevés</title>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar (currentPage='releves')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h4><i class="fas fa-tachometer-alt me-2"></i>Gestion des Relevés</h4>
            <p>Consultez et gérez les relevés de compteurs</p>
        </div>
        <div class="header-actions">
            <div class="user-profile" onclick="window.location.href='/logout'">
                <div class="avatar">
                    <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">U</span>
                </div>
                <div class="user-info">
                    <div class="name" th:text="${#authentication.principal.username}">Utilisateur</div>
                    <div class="role" th:text="${#authentication.principal.authorities}">Rôle</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="row g-4">
            <!-- Formulaire - Visible uniquement pour ADMIN et AGENT -->
            <div class="col-lg-4" th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''AGENT'')')}">
                <div class="data-card">
                    <h5 class="mb-3"><i class="fas fa-plus-circle me-2"></i>Nouveau relevé</h5>
                    <p class="text-muted small">Enregistrez un nouveau relevé de compteur pour un abonné.</p>
                    <form id="releveForm" onsubmit="return createReleve(event)">
                        <div class="mb-3">
                            <label class="form-label">ID Abonné <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-custom" id="releveAbonneId" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ancienne valeur <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-custom" id="ancienneValeur" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nouvelle valeur <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-custom" id="nouvelleValeur" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date du relevé</label>
                            <input type="date" class="form-control form-control-custom" id="releveDate">
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100">
                            <i class="fas fa-save me-1"></i> Enregistrer
                        </button>
                    </form>
                </div>
            </div>

            <!-- Liste -->
            <div class="col-lg-8" th:classappend="${#authorization.expression('hasAnyRole(''ADMIN'', ''AGENT'')')} ? '' : 'col-lg-12'">
                <div class="data-card">
                    <div class="card-header-custom">
                        <h5><i class="fas fa-list me-2"></i>Historique des relevés</h5>
                        <span class="text-muted" id="releveCount">0 relevés</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-custom">
                            <thead>
                            <tr>
                                <th>Abonné</th>
                                <th>Ancienne</th>
                                <th>Nouvelle</th>
                                <th>Consommation</th>
                                <th>Date</th>
                            </tr>
                            </thead>
                            <tbody id="relevesBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted">
                                    <div class="spinner-custom mx-auto"></div>
                                    <span class="d-block mt-2">Chargement des relevés...</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<script>
    $(document).ready(function() {
        loadReleves();
    });

    function loadReleves() {
        $.ajax({
            url: '/api/releves',
            method: 'GET',
            success: function(data) {
                var releves = data || [];
                $('#releveCount').text(releves.length + ' relevés');

                if (releves.length === 0) {
                    $('#relevesBody').html('<tr><td colspan="5" class="text-center text-muted">Aucun relevé trouvé</td></tr>');
                    return;
                }

                var html = '';
                releves.forEach(function(r) {
                    html += '<tr>' +
                        '<td>' + (r.abonne && r.abonne.utilisateur ? r.abonne.utilisateur.nom : 'N/A') + '</td>' +
                        '<td>' + (r.ancienneValeur || 0) + ' m³</td>' +
                        '<td>' + (r.nouvelleValeur || 0) + ' m³</td>' +
                        '<td><strong>' + (r.consommation || 0) + ' m³</strong></td>' +
                        '<td>' + (r.dateReleve || 'N/A') + '</td>' +
                    '</tr>';
                });

                $('#relevesBody').html(html);
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    $('#relevesBody').html('<tr><td colspan="5" class="text-center text-warning">Accès non autorisé</td></tr>');
                } else {
                    $('#relevesBody').html('<tr><td colspan="5" class="text-center text-danger">Erreur de chargement</td></tr>');
                }
            }
        });
    }

    function createReleve(event) {
        event.preventDefault();

        var abonneId = $('#releveAbonneId').val();
        var ancienne = $('#ancienneValeur').val();
        var nouvelle = $('#nouvelleValeur').val();
        var date = $('#releveDate').val() || new Date().toISOString().split('T')[0];

        if (!abonneId || !ancienne || !nouvelle) {
            alert('Veuillez remplir tous les champs obligatoires');
            return false;
        }

        var data = {
            abonne: { id: parseInt(abonneId) },
            ancienneValeur: parseFloat(ancienne),
            nouvelleValeur: parseFloat(nouvelle),
            dateReleve: date
        };

        $.ajax({
            url: '/api/releves',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function() {
                alert('Relevé enregistré avec succès');
                $('#releveForm')[0].reset();
                loadReleves();
            },
            error: function(xhr) {
                alert('Erreur: ' + (xhr.responseText || ''));
            }
        });

        return false;
    }
</script>
</body>
</html>
