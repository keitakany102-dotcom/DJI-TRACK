<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
  <title>Gestion des Réclamations</title>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar (currentPage='reclamations')}"></div>

<div class="main-content">
  <div class="top-header">
    <div class="page-title">
      <h4><i class="fas fa-headset me-2"></i>Gestion des Réclamations</h4>
      <p>Consultez et répondez aux réclamations des abonnés</p>
    </div>
    <div class="header-actions">
      <div class="user-profile" onclick="window.location.href='/logout'">
        <div class="avatar">
          <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">U</span>
        </div>
        <div class="user-info">
          <div class="name" th:text="${#authentication.principal.username}">Utilisateur</div>
          <div class="role" th:text="${#authentication.principal.authorities}">Rôle</div>
        </div>
      </div>
    </div>
  </div>

  <div class="content-area">
    <!-- Statistiques -->
    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon blue">
            <i class="fas fa-list"></i>
          </div>
          <h2 class="stat-number" id="totalReclamations">0</h2>
          <p class="stat-label">Total Réclamations</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon yellow">
            <i class="fas fa-clock"></i>
          </div>
          <h2 class="stat-number" id="reclamationsEnAttente">0</h2>
          <p class="stat-label">En Attente</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon green">
            <i class="fas fa-check-circle"></i>
          </div>
          <h2 class="stat-number" id="reclamationsTraitees">0</h2>
          <p class="stat-label">Traitées</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="stat-icon red">
            <i class="fas fa-times-circle"></i>
          </div>
          <h2 class="stat-number" id="reclamationsRejetees">0</h2>
          <p class="stat-label">Rejetées</p>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="mb-4">
      <button class="btn btn-outline-secondary" onclick="loadReclamations()">
        <i class="fas fa-sync-alt me-1"></i> Rafraîchir
      </button>
    </div>

    <!-- Liste -->
    <div class="data-card">
      <div class="card-header-custom">
        <h5><i class="fas fa-list me-2"></i>Liste des réclamations</h5>
        <span class="text-muted" id="recCount">0 réclamations</span>
      </div>
      <div class="table-responsive">
        <table class="table table-custom">
          <thead>
          <tr>
            <th>Abonné</th>
            <th>Objet</th>
            <th>Date</th>
            <th>Statut</th>
            <th>Réponse</th>
            <th>Actions</th>
          </tr>
          </thead>
          <tbody id="reclamationsBody">
          <tr>
            <td colspan="6" class="text-center text-muted">
              <div class="spinner-custom mx-auto"></div>
              <span class="d-block mt-2">Chargement des réclamations...</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<!-- Modal Répondre -->
<div class="modal fade" id="repondreModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-reply me-2"></i>Répondre à la réclamation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="recIdRepondre">
        <div class="mb-3">
          <label class="form-label">Votre réponse <span class="text-danger">*</span></label>
          <textarea class="form-control form-control-custom" id="reponseText" rows="4" required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
        <button type="button" class="btn btn-primary-custom" onclick="envoyerReponse()">
          <i class="fas fa-send me-1"></i> Envoyer
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function() {
      console.log('Page réclamations chargée');
      loadReclamations();
  });

  function loadReclamations() {
      console.log('Chargement des réclamations...');

      $('#reclamationsBody').html('<tr><td colspan="6" class="text-center text-muted"><div class="spinner-custom mx-auto"></div><span class="d-block mt-2">Chargement...</span></td></tr>');

      $.ajax({
          url: '/api/reclamations',
          method: 'GET',
          success: function(data) {
              console.log('Réclamations reçues:', data.length);
              displayReclamations(data);
              updateStats(data);
          },
          error: function(xhr) {
              console.error('Erreur chargement réclamations:', xhr);
              var msg = 'Erreur de chargement';
              try {
                  var response = JSON.parse(xhr.responseText);
                  if (response.message) msg = response.message;
                  if (response.error) msg = response.error;
              } catch(e) {}
              $('#reclamationsBody').html('<tr><td colspan="6" class="text-center text-danger">Erreur: ' + msg + '</td></tr>');
          }
      });
  }

  function updateStats(data) {
      var recs = data || [];
      var total = recs.length;
      var enAttente = recs.filter(function(r) { return r.statut === 'EN ATTENTE'; }).length;
      var traitees = recs.filter(function(r) { return r.statut === 'TRAITEE'; }).length;
      var rejetees = recs.filter(function(r) { return r.statut === 'REJETEE'; }).length;

      $('#totalReclamations').text(total);
      $('#reclamationsEnAttente').text(enAttente);
      $('#reclamationsTraitees').text(traitees);
      $('#reclamationsRejetees').text(rejetees);
  }

  function displayReclamations(data) {
      var recs = data || [];
      $('#recCount').text(recs.length + ' réclamations');

      if (recs.length === 0) {
          $('#reclamationsBody').html('<tr><td colspan="6" class="text-center text-muted">Aucune réclamation trouvée</td></tr>');
          return;
      }

      var html = '';
      recs.forEach(function(rec) {
          var statusClass = '';
          var statusText = rec.statut || 'EN ATTENTE';
          if (statusText === 'TRAITEE') {
              statusClass = 'payee';
          } else if (statusText === 'EN ATTENTE') {
              statusClass = 'en-attente';
          } else {
              statusClass = 'impayee';
          }

          var actions = '';
          if (statusText === 'EN ATTENTE') {
              actions += '<button class="btn btn-sm btn-primary me-1" onclick="openRepondre(' + rec.id + ')"><i class="fas fa-reply me-1"></i>Répondre</button>';
          }
          actions += '<button class="btn btn-sm btn-outline-danger" onclick="deleteReclamation(' + rec.id + ')"><i class="fas fa-trash"></i></button>';

          var reponseDisplay = rec.reponse || '<span class="text-muted">En attente</span>';
          if (rec.reponse && rec.reponse.length > 30) {
              reponseDisplay = rec.reponse.substring(0, 30) + '...';
          }

          var abonneNom = 'N/A';
          if (rec.abonne && rec.abonne.utilisateur) {
              abonneNom = rec.abonne.utilisateur.nom;
          }

          html += '<tr>' +
              '<td>' + abonneNom + '</td>' +
              '<td><strong>' + (rec.objet || 'N/A') + '</strong></td>' +
              '<td>' + (rec.dateDepot ? (Array.isArray(rec.dateDepot) ? rec.dateDepot.join("-") : rec.dateDepot) : "N/A") + '</td>' +
              '<td><span class="badge-status ' + statusClass + '">' + statusText + '</span></td>' +
              '<td>' + reponseDisplay + '</td>' +
              '<td>' + actions + '</td>' +
          '</tr>';
      });

      $('#reclamationsBody').html(html);
  }

  function openRepondre(id) {
      console.log('Ouverture modal pour répondre à la réclamation #' + id);
      $('#recIdRepondre').val(id);
      $('#reponseText').val('');
      $('#repondreModal').modal('show');
  }

  function envoyerReponse() {
      var id = $('#recIdRepondre').val();
      var reponse = $('#reponseText').val().trim();

      if (!reponse) {
          alert('Veuillez saisir une réponse');
          return;
      }

      console.log('Envoi réponse pour réclamation #' + id);

      $.ajax({
          url: '/api/reclamations/' + id + '/repondre',
          method: 'PUT',
          contentType: 'application/json',
          data: JSON.stringify({ reponse: reponse }),
          success: function() {
              alert('Réponse envoyée avec succès !');
              $('#repondreModal').modal('hide');
              loadReclamations();
          },
          error: function(xhr) {
              console.error('Erreur envoi réponse:', xhr);
              alert('Erreur: ' + (xhr.responseText || 'Impossible d\'envoyer la réponse'));
          }
      });
  }

  function deleteReclamation(id) {
      if (confirm('Êtes-vous sûr de vouloir supprimer cette réclamation #' + id + ' ?')) {
          $.ajax({
              url: '/api/reclamations/' + id,
              method: 'DELETE',
              success: function() {
                  alert('Réclamation supprimée avec succès');
                  loadReclamations();
              },
              error: function(xhr) {
                  alert('Erreur: ' + (xhr.responseText || ''));
              }
          });
      }
  }
</script>
</body>
</html>
