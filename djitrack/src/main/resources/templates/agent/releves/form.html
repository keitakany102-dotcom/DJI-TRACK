<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Nouveau relevé')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="main-wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <main>
        <div class="page-header fade-up">
            <div>
                <h1 class="page-title"><i class="bi bi-clipboard-plus"></i> Saisir un relevé</h1>
                <div class="breadcrumb-custom"><i class="bi bi-house"></i> Agent &rsaquo; Relevés &rsaquo; Nouveau</div>
            </div>
            <a th:href="@{/agent/releves}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="card fade-up" style="max-width:600px;">
            <div class="card-header"><i class="bi bi-clipboard-data"></i> Informations du relevé</div>
            <div class="card-body">
                <form th:action="@{/agent/releves/save}" method="post" enctype="multipart/form-data">
                    <input type="hidden" name="compteurId" th:value="${compteurId}">

                    <div class="mb-3">
                        <label class="form-label">Index relevé (m³) *</label>
                        <div class="input-group">
                            <input type="number" step="0.01" name="index" class="form-control"
                                   placeholder="0.00" required>
                            <span class="input-group-text">m³</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Photo du compteur</label>
                        <input type="file" name="photo" class="form-control" accept="image/*">
                        <div class="form-text">Prenez une photo claire du cadran du compteur</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Géolocalisation</label>
                        <div class="input-group">
                            <input type="text" name="geolocalisation" class="form-control" placeholder="latitude, longitude">
                            <button type="button" class="btn btn-outline-secondary" onclick="getGPS()">
                                <i class="bi bi-geo-alt"></i> GPS
                            </button>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Enregistrer le relevé
                        </button>
                        <a th:href="@{/agent/releves}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script>
function getGPS() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) {
            document.querySelector('[name=geolocalisation]').value =
                pos.coords.latitude.toFixed(6) + ', ' + pos.coords.longitude.toFixed(6);
        });
    }
}
</script>
</body>
</html>
