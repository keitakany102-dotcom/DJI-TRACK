<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Mon espace')}">
</head>
<body>
<div th:replace="~{fragments/sidebar-abonne :: sidebar-abonne}"></div>
<!-- Dans toutes les pages -->
<div th:insert="~{fragments/sidebar-selector :: sidebar-selector}"></div>

<main class="main-content" id="mainContent">
    <header class="main-header">
        <div class="header-left">
            <button class="btn btn-toggle-sidebar" id="toggleSidebar">
                <i class="bi bi-list"></i>
            </button>
            <h4 class="page-title">Mon espace</h4>
        </div>
        <div class="header-right">
            <span class="badge bg-secondary me-3">Abonné</span>
            <span class="user-email" th:text="${#authentication.name}">abonne@djitrack.com</span>
        </div>
    </header>

    <section class="content">
        <!-- Infos personnelles -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon bg-primary"><i class="bi bi-person-circle"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Mon statut</span>
                        <span class="stat-value" style="font-size:1rem;"><span class="badge bg-success">Actif</span></span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon bg-warning"><i class="bi bi-file-earmark-text-fill"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Dernière facture</span>
                        <span class="stat-value" style="font-size:1rem;" id="lastFacture">-</span>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon bg-success"><i class="bi bi-credit-card-fill"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Dernier paiement</span>
                        <span class="stat-value" style="font-size:1rem;" id="lastPaiement">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Consommation -->
        <div class="row g-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Ma consommation</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="chartConsommation" height="250"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Actions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a href="/reclamations" class="btn btn-outline-danger">
                                <i class="bi bi-chat-dots"></i> Réclamer
                            </a>
                            <a href="/paiements" class="btn btn-outline-success">
                                <i class="bi bi-credit-card"></i> Payer
                            </a>
                            <a href="/factures" class="btn btn-outline-primary">
                                <i class="bi bi-file-earmark-text"></i> Voir mes factures
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<script th:replace="~{fragments/scripts :: scripts}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        loadAbonneDashboard();
    });

    async function loadAbonneDashboard() {
        try {
            const [factures, paiements] = await Promise.all([
                fetch('/api/factures').then(r => r.json()),
                fetch('/api/paiements').then(r => r.json())
            ]);

            if (Array.isArray(factures) && factures.length) {
                const last = factures[factures.length - 1];
                document.getElementById('lastFacture').textContent =
                    `${last.montantTotal || 0} FCFA - ${last.statut || 'EN ATTENTE'}`;
            }

            if (Array.isArray(paiements) && paiements.length) {
                const last = paiements[paiements.length - 1];
                document.getElementById('lastPaiement').textContent =
                    `${last.montant || 0} FCFA - ${last.mode || '-'}`;
            }

            // Graphique consommation
            const ctx = document.getElementById('chartConsommation').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin'],
                    datasets: [{
                        label: 'Consommation (kWh)',
                        data: [120, 145, 130, 160, 150, 175],
                        backgroundColor: 'rgba(37, 99, 235, 0.7)',
                        borderColor: '#2563eb',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

        } catch (error) {
            console.error('Abonne dashboard error:', error);
        }
    }
</script>
</body>
</html>
