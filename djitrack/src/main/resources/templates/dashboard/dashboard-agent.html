<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header">
    <title>Dashboard Agent</title>
</head>
<body>
<div th:replace="fragments/sidebar :: sidebar (currentPage='dashboard-agent')"></div>

<div class="main-content">
    <!-- Top Header -->
    <div class="top-header">
        <div class="page-title">
            <h4><i class="fas fa-th-large me-2"></i>Tableau de bord Agent</h4>
            <p>Gestion des factures et des paiements</p>
        </div>
        <div class="header-actions">
            <button class="notification-btn">
                <i class="fas fa-bell"></i>
            </button>
            <div class="user-profile" onclick="window.location.href='/logout'">
                <div class="avatar">
                    <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">A</span>
                </div>
                <div class="user-info">
                    <div class="name" th:text="${#authentication.principal.username}">Agent</div>
                    <div class="role">Agent de recouvrement</div>
                </div>
                <i class="fas fa-chevron-down" style="color: #6c757d; font-size: 12px; margin-left: 5px;"></i>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content-area">
        <!-- Stats Cards -->
        <div class="row g-4 mb-4">
            <div class="col-xl-3 col-lg-6 col-md-6">
                <div class="stat-card fade-in">
                    <div class="stat-icon blue">
                        <i class="fas fa-file-invoice"></i>
                    </div>
                    <h2 class="stat-number" id="totalFactures">0</h2>
                    <p class="stat-label">Total Factures</p>
                </div>
            </div>
            <div class="col-xl-3 col-lg-6 col-md-6">
                <div class="stat-card fade-in" style="animation-delay: 0.1s;">
                    <div class="stat-icon green">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h2 class="stat-number" id="facturesPayees">0</h2>
                    <p class="stat-label">Factures payées</p>
                </div>
            </div>
            <div class="col-xl-3 col-lg-6 col-md-6">
                <div class="stat-card fade-in" style="animation-delay: 0.2s;">
                    <div class="stat-icon yellow">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h2 class="stat-number" id="facturesAttente">0</h2>
                    <p class="stat-label">En attente</p>
                </div>
            </div>
            <div class="col-xl-3 col-lg-6 col-md-6">
                <div class="stat-card fade-in" style="animation-delay: 0.3s;">
                    <div class="stat-icon red">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h2 class="stat-number" id="facturesImpayees">0</h2>
                    <p class="stat-label">Impayées</p>
                </div>
            </div>
        </div>

        <!-- Recent Invoices -->
        <div class="data-card slide-up">
            <div class="card-header-custom">
                <h5><i class="fas fa-file-invoice me-2"></i>Dernières factures</h5>
                <button class="btn btn-sm btn-primary-custom" data-bs-toggle="modal" data-bs-target="#createFactureModal">
                    <i class="fas fa-plus me-1"></i> Nouvelle facture
                </button>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                    <tr>
                        <th>N° Facture</th>
                        <th>Abonné</th>
                        <th>Montant</th>
                        <th>Date</th>
                        <th>Statut</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="recentFactures">
                    <tr>
                        <td colspan="6" class="text-center text-muted">Chargement...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
</div>

<!-- Modal Créer Facture -->
<div class="modal fade" id="createFactureModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-file-invoice me-2"></i>Créer une nouvelle facture</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="factureForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Numéro de facture <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-custom" id="factureNumero" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Montant total <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-custom" id="factureMontant" step="0.01" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">ID Abonné <span class="text-danger">*</span></label>
                            <input type="number" class="form-control form-control-custom" id="factureAbonneId" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Date d'émission</label>
                            <input type="date" class="form-control form-control-custom" id="factureDate">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Statut</label>
                            <select class="form-control form-control-custom" id="factureStatut">
                                <option value="EN ATTENTE">En attente</option>
                                <option value="PAYEE">Payée</option>
                                <option value="IMPAYEE">Impayée</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary-custom" onclick="createFacture()">
                    <i class="fas fa-save me-1"></i> Créer la facture
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        loadStats();
        loadRecentFactures();
    });

    function loadStats() {
        $.ajax({
            url: '/api/factures/stats',
            method: 'GET',
            success: function(data) {
                if (data) {
                    $('#totalFactures').text(data.total || 0);
                    $('#facturesPayees').text(data.payees || 0);
                    $('#facturesAttente').text(data.enAttente || 0);
                    $('#facturesImpayees').text(data.impayees || 0);
                }
            }
        });
    }

    function loadRecentFactures() {
        $.ajax({
            url: '/api/factures',
            method: 'GET',
            success: function(data) {
                if (data && data.length > 0) {
                    var html = '';
                    var recent = data.slice(0, 10);
                    recent.forEach(function(facture) {
                        var statusClass = '';
                        var statusText = facture.statut || 'EN ATTENTE';
                        if (statusText === 'PAYEE') {
                            statusClass = 'payee';
                        } else if (statusText === 'EN ATTENTE') {
                            statusClass = 'en-attente';
                        } else {
                            statusClass = 'impayee';
                        }

                        html += '<tr>' +
                            '<td><strong>' + (facture.numero || 'N/A') + '</strong></td>' +
                            '<td>' + (facture.abonne ? (facture.abonne.utilisateur ? facture.abonne.utilisateur.nom : 'N/A') : 'N/A') + '</td>' +
                            '<td><strong>' + (facture.montantTotal ? facture.montantTotal.toLocaleString() + ' CFA' : '0 CFA') + '</strong></td>' +
                            '<td>' + (facture.dateEmission || 'N/A') + '</td>' +
                            '<td><span class="badge-status ' + statusClass + '">' + statusText + '</span></td>' +
                            '<td>' +
                                '<button class="btn btn-sm btn-outline-primary me-1" onclick="editFacture(' + facture.id + ')"><i class="fas fa-edit"></i></button>' +
                                '<button class="btn btn-sm btn-outline-danger" onclick="deleteFacture(' + facture.id + ')"><i class="fas fa-trash"></i></button>' +
                            '</td>' +
                        '</tr>';
                    });
                    $('#recentFactures').html(html);
                } else {
                    $('#recentFactures').html('<tr><td colspan="6" class="text-center text-muted">Aucune facture trouvée</td></tr>');
                }
            },
            error: function() {
                $('#recentFactures').html('<tr><td colspan="6" class="text-center text-muted">Erreur de chargement</td></tr>');
            }
        });
    }

    function createFacture() {
        var numero = $('#factureNumero').val();
        var montant = $('#factureMontant').val();
        var abonneId = $('#factureAbonneId').val();
        var date = $('#factureDate').val() || new Date().toISOString().split('T')[0];
        var statut = $('#factureStatut').val();

        if (!numero || !montant || !abonneId) {
            alert('Veuillez remplir tous les champs obligatoires');
            return;
        }

        var data = {
            numero: numero,
            montantTotal: parseFloat(montant),
            dateEmission: date,
            statut: statut,
            abonne: { id: parseInt(abonneId) }
        };

        $.ajax({
            url: '/api/factures',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(data),
            success: function() {
                alert('Facture créée avec succès');
                $('#createFactureModal').modal('hide');
                $('#factureForm')[0].reset();
                loadStats();
                loadRecentFactures();
            },
            error: function(xhr) {
                alert('Erreur: ' + (xhr.responseText || 'Impossible de créer la facture'));
            }
        });
    }

    function editFacture(id) {
        window.location.href = '/factures?edit=' + id;
    }

    function deleteFacture(id) {
        if (confirm('Êtes-vous sûr de vouloir supprimer cette facture ?')) {
            $.ajax({
                url: '/api/factures/' + id,
                method: 'DELETE',
                success: function() {
                    alert('Facture supprimée');
                    loadStats();
                    loadRecentFactures();
                },
                error: function() {
                    alert('Erreur lors de la suppression');
                }
            });
        }
    }
</script>
</body>
</html>
