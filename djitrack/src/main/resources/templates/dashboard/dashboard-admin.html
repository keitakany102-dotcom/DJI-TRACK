<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Tableau de bord - Admin')}">
</head>
<body>

<!-- Sidebar avec sélecteur (corrigé) -->
<div th:replace="~{fragments/sidebar-selector :: sidebar-selector}"></div>

<main class="main-content" id="mainContent">
    <!-- Header -->
    <header class="main-header">
        <div class="header-left">
            <button class="btn btn-toggle-sidebar" id="toggleSidebar">
                <i class="bi bi-list"></i>
            </button>
            <h4 class="page-title">Tableau de bord</h4>
        </div>
        <div class="header-right">
            <span class="badge bg-danger me-3">Admin</span>
            <span class="user-email" th:text="${#authentication.name}">admin@djitrack.com</span>
        </div>
    </header>

    <!-- Content -->
    <section class="content">
        <!-- Statistiques -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-primary"><i class="bi bi-people-fill"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Total Abonnés</span>
                        <span class="stat-value" id="totalAbonnes">0</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-success"><i class="bi bi-credit-card-fill"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Paiements</span>
                        <span class="stat-value" id="totalPaiements">0</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-warning"><i class="bi bi-file-earmark-text-fill"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Factures</span>
                        <span class="stat-value" id="totalFactures">0</span>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon bg-danger"><i class="bi bi-chat-dots-fill"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Réclamations</span>
                        <span class="stat-value" id="totalReclamations">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5>Évolution des paiements</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="chartPaiements" height="250"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h5>Rapport rapide</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary w-100 mb-2" id="generateReportBtn">
                            <i class="bi bi-file-earmark-bar-graph"></i> Générer un rapport
                        </button>
                        <div id="reportResult" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Activité récente -->
        <div class="card mt-4">
            <div class="card-header">
                <h5>Activité récente</h5>
            </div>
            <div class="card-body">
                <div id="recentActivity">
                    <p class="text-muted text-center">Chargement des activités...</p>
                </div>
            </div>
        </div>
    </section>
</main>

<!-- Scripts -->
<script th:replace="~{fragments/scripts :: scripts}"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const API_BASE = '/api';
    const TOKEN_KEY = 'djitrack_token';

    function getToken() {
        return localStorage.getItem(TOKEN_KEY);
    }

    function getHeaders() {
        const token = getToken();
        if (!token) {
            window.location.href = '/login';
            return {};
        }
        return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };
    }

    // ============================================
    // TOAST NOTIFICATIONS
    // ============================================
    function showToast(message, type = 'success') {
        const colors = {
            success: 'bg-success text-white',
            error: 'bg-danger text-white',
            info: 'bg-info text-white',
            warning: 'bg-warning text-dark'
        };

        let container = document.getElementById('toastContainer');
        if (!container) {
            container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container position-fixed bottom-0 end-0 p-3';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        toast.className = `toast align-items-center ${colors[type] || colors.info} border-0`;
        toast.role = 'alert';
        toast.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        `;

        container.appendChild(toast);
        const bsToast = new bootstrap.Toast(toast, { delay: 4000 });
        bsToast.show();
        toast.addEventListener('hidden.bs.toast', () => toast.remove());
    }

    // ============================================
    // TOGGLE SIDEBAR
    // ============================================
    document.getElementById('toggleSidebar')?.addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('open');
    });

    // ============================================
    // DASHBOARD
    // ============================================
    async function loadAdminDashboard() {
        try {
            const token = getToken();
            if (!token) {
                window.location.href = '/login';
                return;
            }

            const headers = getHeaders();

            // Charger les données
            const [abonnes, paiements, factures, reclamations] = await Promise.all([
                fetch(`${API_BASE}/abonnes`, { headers }).then(r => r.json()).catch(() => []),
                fetch(`${API_BASE}/paiements`, { headers }).then(r => r.json()).catch(() => []),
                fetch(`${API_BASE}/factures`, { headers }).then(r => r.json()).catch(() => []),
                fetch(`${API_BASE}/reclamations`, { headers }).then(r => r.json()).catch(() => [])
            ]);

            // Mettre à jour les statistiques
            document.getElementById('totalAbonnes').textContent = Array.isArray(abonnes) ? abonnes.length : 0;
            document.getElementById('totalPaiements').textContent = Array.isArray(paiements) ? paiements.length : 0;
            document.getElementById('totalFactures').textContent = Array.isArray(factures) ? factures.length : 0;
            document.getElementById('totalReclamations').textContent = Array.isArray(reclamations) ? reclamations.length : 0;

            // Graphique des paiements
            const ctx = document.getElementById('chartPaiements');
            if (ctx) {
                // Compter les paiements par mois
                const months = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin'];
                const dataByMonth = new Array(6).fill(0);

                if (Array.isArray(paiements)) {
                    paiements.forEach(p => {
                        if (p.datePaiement) {
                            const date = new Date(p.datePaiement);
                            const month = date.getMonth();
                            if (month >= 0 && month < 6) {
                                dataByMonth[month]++;
                            }
                        }
                    });
                }

                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Paiements',
                            data: dataByMonth,
                            borderColor: '#2563eb',
                            backgroundColor: 'rgba(37, 99, 235, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
            }

            // Activité récente
            const activity = document.getElementById('recentActivity');
            const recent = [];
            if (Array.isArray(paiements) && paiements.length) {
                recent.push(`💰 ${paiements.length} paiement(s) effectué(s)`);
            }
            if (Array.isArray(reclamations) && reclamations.length) {
                const enCours = reclamations.filter(r => r.statut === 'EN ATTENTE').length;
                recent.push(`📝 ${enCours} réclamation(s) en cours`);
            }
            if (Array.isArray(factures) && factures.length) {
                const impayees = factures.filter(f => f.statut !== 'PAYEE').length;
                recent.push(`📄 ${impayees} facture(s) impayée(s)`);
            }
            activity.innerHTML = recent.length ?
                `<ul class="list-unstyled">${recent.map(r => `<li><i class="bi bi-dot"></i> ${r}</li>`).join('')}</ul>` :
                '<p class="text-muted text-center">Aucune activité récente</p>';

        } catch (error) {
            console.error('Dashboard error:', error);
            showToast('❌ Erreur de chargement du dashboard', 'error');
        }
    }

    // ============================================
    // GÉNÉRER UN RAPPORT
    // ============================================
    document.getElementById('generateReportBtn')?.addEventListener('click', async function() {
        const resultDiv = document.getElementById('reportResult');
        resultDiv.innerHTML = '<div class="text-center"><div class="spinner-border text-primary" role="status"></div></div>';

        try {
            const response = await fetch(`${API_BASE}/rapports/generer`, {
                method: 'POST',
                headers: getHeaders()
            });

            if (response.ok) {
                const data = await response.json();
                resultDiv.innerHTML = `
                    <div class="alert alert-success">
                        <i class="bi bi-check-circle-fill"></i> Rapport généré avec succès
                        <br><small class="text-muted">ID: ${data.id || 'N/A'}</small>
                    </div>
                `;
                showToast('✅ Rapport généré avec succès', 'success');
            } else {
                const error = await response.text();
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill"></i> ${error || 'Erreur lors de la génération'}
                    </div>
                `;
                showToast('❌ Erreur lors de la génération', 'error');
            }
        } catch (error) {
            resultDiv.innerHTML = `
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i> Erreur de connexion
                </div>
            `;
            showToast('❌ Erreur de connexion', 'error');
        }
    });

    // ============================================
    // INITIALISATION
    // ============================================
    document.addEventListener('DOMContentLoaded', function() {
        const token = getToken();
        if (!token) {
            window.location.href = '/login';
            return;
        }
        loadAdminDashboard();

        // Rafraîchir automatiquement toutes les 60 secondes
        setInterval(loadAdminDashboard, 60000);
    });
</script>

</body>
</html>
