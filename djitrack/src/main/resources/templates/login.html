<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DjiTrack - Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0d1117 0%, #1a1f2e 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-card {
        background: #fff;
        border-radius: 16px;
        padding: 48px 40px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .login-brand { text-align: center; margin-bottom: 32px; }
    .login-brand i { font-size: 3rem; color: #f0b429; }
    .login-brand h2 { font-weight: 700; color: #0d1117; margin-top: 8px; }
    .login-brand p { color: #6b7280; font-size: 0.95rem; }
    .form-control { padding: 12px 16px; border-radius: 10px; }
    .btn-login { padding: 12px; border-radius: 10px; font-weight: 600; background: #0d1117; border: none; color: #fff; width: 100%; }
    .btn-login:hover { background: #1a1f2e; color: #fff; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .alert { border-radius: 10px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #6b7280; }
    .auth-footer a { color: #0d1117; font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-brand">
    <i class="bi bi-lightning-fill"></i>
    <h2>DjiTrack</h2>
    <p>Plateforme de gestion des abonnements</p>
  </div>

  <div id="loginResult"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label fw-semibold">Email</label>
      <input type="email" id="email" class="form-control" placeholder="votre@email.com" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold">Mot de passe</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>
    <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
      <i class="bi bi-box-arrow-in-right"></i> Se connecter
    </button>
  </form>

  <div class="auth-footer">
    <p>Pas encore de compte ? <a href="/register">S'inscrire</a></p>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const resultDiv = document.getElementById('loginResult');

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Connexion en cours...';
      resultDiv.innerHTML = '';

      try {
          const response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include', // important : inclure les cookies de session
              body: JSON.stringify({ email, password })
          });

          if (response.ok) {
              const data = await response.json();

              // Sauvegarder pour les appels API fetch
              localStorage.setItem('djitrack_token', data.token);
              localStorage.setItem('djitrack_role', data.role);
              localStorage.setItem('djitrack_email', data.email);
              localStorage.setItem('djitrack_nom', data.nom || '');

              resultDiv.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Connexion réussie ! Redirection...</div>';

              // Redirection selon le rôle
              // La session Spring Security est déjà créée côté serveur
              // donc la navigation vers le dashboard fonctionnera
              setTimeout(() => {
                  if (data.role === 'ROLE_ADMIN') {
                      window.location.replace('/dashboard/admin');
                  } else if (data.role === 'ROLE_AGENT') {
                      window.location.replace('/dashboard/agent');
                  } else {
                      window.location.replace('/dashboard/abonne');
                  }
              }, 800);

          } else {
              let errorMsg = 'Email ou mot de passe incorrect';
              try { errorMsg = await response.text(); } catch(e) {}
              resultDiv.innerHTML = `<div class="alert alert-danger"><i class="bi bi-x-circle me-2"></i>${errorMsg}</div>`;
              loginBtn.disabled = false;
              loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Se connecter';
          }
      } catch (err) {
          resultDiv.innerHTML = `<div class="alert alert-danger"><i class="bi bi-wifi-off me-2"></i>Erreur de connexion au serveur</div>`;
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Se connecter';
      }
  });
</script>
</body>
</html>
