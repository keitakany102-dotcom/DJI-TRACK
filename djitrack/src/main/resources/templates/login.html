<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Connexion')"></head>
<body class="auth-page">
<div class="auth-card">
    <div class="auth-logo">
        <div class="auth-logo-icon"><i class="bi bi-droplet-fill"></i></div>
        <div class="auth-logo-text">
            <div class="brand">Djitrack</div>
            <div class="subtitle">Gestion des eaux</div>
        </div>
    </div>

    <h2 class="auth-title">Bienvenue 👋</h2>
    <p class="auth-subtitle">Connectez-vous à votre espace</p>

    <div th:if="${param.error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i> Nom d'utilisateur ou mot de passe incorrect.
    </div>
    <div th:if="${param.success}" class="alert alert-success">
        <i class="bi bi-check-circle"></i> Inscription réussie, veuillez vous connecter.
    </div>
    <div th:if="${param.logout}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> Vous avez été déconnecté avec succès.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label"><i class="bi bi-person me-1"></i> Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" placeholder="Entrez votre identifiant" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label"><i class="bi bi-lock me-1"></i> Mot de passe</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="bi bi-box-arrow-in-right"></i> Se connecter
        </button>
    </form>

    <div class="auth-divider"><span>ou</span></div>

    <p class="text-center mb-0" style="font-size:0.875rem;color:#64748b;">
        Pas encore de compte ?
        <a href="/register" class="fw-600" style="color:var(--primary);text-decoration:none;">S'inscrire</a>
    </p>
</div>
</body>
</html>
