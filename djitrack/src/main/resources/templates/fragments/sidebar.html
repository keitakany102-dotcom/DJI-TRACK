<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="sidebar" class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">
            <i class="fas fa-water"></i>
        </div>
        <h3>DJI<span>Track</span></h3>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-label">Menu Principal</div>

        <div class="nav-item">
            <a th:href="@{/dashboard}" class="nav-link" th:classappend="${currentPage == 'dashboard'} ? 'active' : ''">
                <i class="fas fa-th-large"></i>
                <span>Tableau de bord</span>
            </a>
        </div>

        <div class="nav-item">
            <a th:href="@{/abonnes}" class="nav-link" th:classappend="${currentPage == 'abonnes'} ? 'active' : ''">
                <i class="fas fa-users"></i>
                <span>Abonnés</span>
            </a>
        </div>

        <div class="nav-item">
            <a th:href="@{/releves}" class="nav-link" th:classappend="${currentPage == 'releves'} ? 'active' : ''">
                <i class="fas fa-tachometer-alt"></i>
                <span>Relevés</span>
            </a>
        </div>

        <div class="nav-item">
            <a th:href="@{/factures}" class="nav-link" th:classappend="${currentPage == 'factures'} ? 'active' : ''">
                <i class="fas fa-file-invoice"></i>
                <span>Factures</span>
                <span class="badge" id="factureBadge">0</span>
            </a>
        </div>

        <div class="nav-item">
            <a th:href="@{/paiements}" class="nav-link" th:classappend="${currentPage == 'paiements'} ? 'active' : ''">
                <i class="fas fa-credit-card"></i>
                <span>Paiements</span>
            </a>
        </div>

        <div class="nav-item">
            <a th:href="@{/reclamations}" class="nav-link" th:classappend="${currentPage == 'reclamations'} ? 'active' : ''">
                <i class="fas fa-headset"></i>
                <span>Réclamations</span>
                <span class="badge" id="reclamationBadge">0</span>
            </a>
        </div>

        <div class="nav-item">
            <a th:href="@{/rapports}" class="nav-link" th:classappend="${currentPage == 'rapports'} ? 'active' : ''">
                <i class="fas fa-chart-bar"></i>
                <span>Rapports</span>
            </a>
        </div>

        <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
            <div class="nav-label" style="margin-top: 20px;">Administration</div>

            <div class="nav-item">
                <a th:href="@{/admin/dashboard}" class="nav-link" th:classappend="${currentPage == 'admin-dashboard'} ? 'active' : ''">
                    <i class="fas fa-cog"></i>
                    <span>Admin Dashboard</span>
                </a>
            </div>

            <div class="nav-item">
                <a th:href="@{/admin/users}" class="nav-link" th:classappend="${currentPage == 'admin-users'} ? 'active' : ''">
                    <i class="fas fa-user-shield"></i>
                    <span>Gestion utilisateurs</span>
                </a>
            </div>
        </div>
    </nav>
</div>
