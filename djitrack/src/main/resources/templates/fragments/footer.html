<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="footer" class="footer" style="background: white; padding: 20px 30px; border-top: 1px solid #e8eaed; margin-top: 30px;">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div>
            <span class="text-muted" style="font-size: 14px;">
                &copy; 2026 <strong>DJI Track</strong> - Gestion des Factures d'Eau
            </span>
        </div>
        <div>
            <span class="text-muted" style="font-size: 13px;">
                <i class="fas fa-code"></i> Version 1.0
                <span class="mx-2">|</span>
                <i class="fas fa-heart text-danger"></i> Made with care
            </span>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function() {
        $('.sidebar-toggle').on('click', function() {
            $('#sidebar').toggleClass('show');
        });

        $(document).on('click', function(e) {
            if ($(window).width() <= 768) {
                if (!$(e.target).closest('#sidebar').length && !$(e.target).closest('.sidebar-toggle').length) {
                    $('#sidebar').removeClass('show');
                }
            }
        });

        loadBadges();
    });

    function loadBadges() {
        $.ajax({
            url: '/api/factures/stats',
            method: 'GET',
            success: function(data) {
                if (data && data.enAttente > 0) {
                    $('#factureBadge').text(data.enAttente).show();
                } else {
                    $('#factureBadge').hide();
                }
            },
            error: function() {
                $('#factureBadge').hide();
            }
        });

        $.ajax({
            url: '/api/reclamations',
            method: 'GET',
            success: function(data) {
                if (data && Array.isArray(data)) {
                    var pending = data.filter(r => r.statut === 'EN ATTENTE').length;
                    if (pending > 0) {
                        $('#reclamationBadge').text(pending).show();
                    } else {
                        $('#reclamationBadge').hide();
                    }
                }
            },
            error: function() {
                $('#reclamationBadge').hide();
            }
        });
    }
</script>
