<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Gestion des Utilisateurs</title>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar (currentPage='admin-users')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h4><i class="fas fa-users-cog me-2"></i>Gestion des Utilisateurs</h4>
            <p>Administrez tous les utilisateurs de la plateforme</p>
        </div>
        <div class="header-actions">
            <button class="btn btn-primary-custom" onclick="window.location.href='/admin/users/create'">
                <i class="fas fa-plus me-1"></i> Nouvel utilisateur
            </button>
            <div class="user-profile" onclick="window.location.href='/logout'">
                <div class="avatar">
                    <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">A</span>
                </div>
                <div class="user-info">
                    <div class="name" th:text="${#authentication.principal.username}">Admin</div>
                    <div class="role">Administrateur</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content-area">
        <!-- Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-users"></i>
                    </div>
                    <h2 class="stat-number" id="adminTotalUsers">0</h2>
                    <p class="stat-label">Total Utilisateurs</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <h2 class="stat-number" id="adminAdmins">0</h2>
                    <p class="stat-label">Administrateurs</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-icon yellow">
                        <i class="fas fa-user-cog"></i>
                    </div>
                    <h2 class="stat-number" id="adminAgents">0</h2>
                    <p class="stat-label">Agents</p>
                </div>
            </div>
        </div>

        <!-- Search -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control form-control-custom" id="searchInput" placeholder="Rechercher un utilisateur...">
                    <button class="btn btn-primary-custom" onclick="searchUsers()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="col-md-6 text-md-end">
                <div class="btn-group">
                    <button class="btn btn-outline-secondary" onclick="filterUsers('all')">Tous</button>
                    <button class="btn btn-outline-danger" onclick="filterUsers('ROLE_ADMIN')">Admins</button>
                    <button class="btn btn-outline-warning" onclick="filterUsers('ROLE_AGENT')">Agents</button>
                    <button class="btn btn-outline-info" onclick="filterUsers('ROLE_ABONNE')">Abonnés</button>
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="data-card">
            <div class="card-header-custom">
                <h5><i class="fas fa-list me-2"></i>Liste des utilisateurs</h5>
                <span class="text-muted" id="userCount">0 utilisateurs</span>
            </div>
            <div class="table-responsive">
                <table class="table table-custom">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Rôle</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    <tr>
                        <td colspan="6" class="text-center text-muted">
                            <div class="spinner-custom mx-auto"></div>
                            <span class="d-block mt-2">Chargement des utilisateurs...</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<script>
    var currentFilter = 'all';
    var currentSearch = '';

    $(document).ready(function() {
        loadUsers();

        $('#searchInput').on('keypress', function(e) {
            if (e.which === 13) {
                searchUsers();
            }
        });
    });

    function loadUsers() {
        $.ajax({
            url: '/admin/api/users',
            method: 'GET',
            success: function(data) {
                displayUsers(data);
                updateStats(data);
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    $('#usersTableBody').html('<tr><td colspan="6" class="text-center text-warning">Accès non autorisé - Vous n\'avez pas les permissions nécessaires</td></tr>');
                } else {
                    $('#usersTableBody').html('<tr><td colspan="6" class="text-center text-danger">Erreur de chargement des utilisateurs</td></tr>');
                }
            }
        });
    }

    function updateStats(users) {
        if (!users) return;

        $('#adminTotalUsers').text(users.length);
        var admins = users.filter(u => u.role === 'ROLE_ADMIN').length;
        var agents = users.filter(u => u.role === 'ROLE_AGENT').length;

        $('#adminAdmins').text(admins);
        $('#adminAgents').text(agents);
    }

    function displayUsers(users) {
        var filtered = users;

        if (currentFilter !== 'all') {
            filtered = users.filter(u => u.role === currentFilter);
        }

        if (currentSearch) {
            var search = currentSearch.toLowerCase();
            filtered = filtered.filter(u =>
                (u.nom && u.nom.toLowerCase().includes(search)) ||
                (u.email && u.email.toLowerCase().includes(search))
            );
        }

        $('#userCount').text(filtered.length + ' utilisateurs');

        if (filtered.length === 0) {
            $('#usersTableBody').html('<tr><td colspan="6" class="text-center text-muted">Aucun utilisateur trouvé</td></tr>');
            return;
        }

        var html = '';
        filtered.forEach(function(user) {
            var roleBadge = '';
            if (user.role === 'ROLE_ADMIN') {
                roleBadge = '<span class="badge bg-danger">Administrateur</span>';
            } else if (user.role === 'ROLE_AGENT') {
                roleBadge = '<span class="badge bg-warning text-dark">Agent</span>';
            } else {
                roleBadge = '<span class="badge bg-info">Abonné</span>';
            }

            html += '<tr>' +
                '<td>' + user.id + '</td>' +
                '<td><strong>' + (user.nom || 'N/A') + '</strong></td>' +
                '<td>' + user.email + '</td>' +
                '<td>' + (user.telephone || 'N/A') + '</td>' +
                '<td>' + roleBadge + '</td>' +
                '<td>' +
                    '<button class="btn btn-sm btn-outline-primary me-1" onclick="editUser(' + user.id + ')"><i class="fas fa-edit"></i></button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteUser(' + user.id + ')"><i class="fas fa-trash"></i></button>' +
                '</td>' +
            '</tr>';
        });

        $('#usersTableBody').html(html);
    }

    function filterUsers(filter) {
        currentFilter = filter;
        loadUsers();
    }

    function searchUsers() {
        currentSearch = $('#searchInput').val().trim();
        loadUsers();
    }

    function editUser(id) {
        window.location.href = '/admin/users/edit/' + id;
    }

    function deleteUser(id) {
        if (confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ? Cette action est irréversible.')) {
            $.ajax({
                url: '/admin/api/users/' + id,
                method: 'DELETE',
                success: function() {
                    alert('Utilisateur supprimé avec succès');
                    loadUsers();
                },
                error: function(xhr) {
                    alert('Erreur: ' + (xhr.responseText || 'Impossible de supprimer l\'utilisateur'));
                }
            });
        }
    }
</script>
</body>
</html>
