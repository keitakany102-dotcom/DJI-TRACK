<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Dashboard Admin</title>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar (currentPage='admin-dashboard')}"></div>

<div class="main-content">
    <div class="top-header">
        <div class="page-title">
            <h4><i class="fas fa-cog me-2"></i>Administration</h4>
            <p>Gestion avancée de la plateforme</p>
        </div>
        <div class="header-actions">
            <button class="notification-btn">
                <i class="fas fa-bell"></i>
                <span class="badge-dot"></span>
            </button>
            <div class="user-profile" onclick="window.location.href='/logout'">
                <div class="avatar">
                    <span th:text="${#authentication.principal.username.substring(0,1).toUpperCase()}">A</span>
                </div>
                <div class="user-info">
                    <div class="name" th:text="${#authentication.principal.username}">Admin</div>
                    <div class="role">Administrateur</div>
                </div>
                <i class="fas fa-chevron-down" style="color: #6c757d; font-size: 12px; margin-left: 5px;"></i>
            </div>
        </div>
    </div>

    <div class="content-area">
        <div class="data-card">
            <div class="card-header-custom">
                <h5><i class="fas fa-chart-pie me-2"></i>Statistiques générales</h5>
            </div>
            <div class="row g-4">
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon blue">
                            <i class="fas fa-users"></i>
                        </div>
                        <h2 class="stat-number" id="adminTotalUsers">0</h2>
                        <p class="stat-label">Utilisateurs</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon green">
                            <i class="fas fa-user-tie"></i>
                        </div>
                        <h2 class="stat-number" id="adminTotalAdmins">0</h2>
                        <p class="stat-label">Administrateurs</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon yellow">
                            <i class="fas fa-user-cog"></i>
                        </div>
                        <h2 class="stat-number" id="adminTotalAgents">0</h2>
                        <p class="stat-label">Agents</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <div class="stat-icon red">
                            <i class="fas fa-user"></i>
                        </div>
                        <h2 class="stat-number" id="adminTotalAbonnes">0</h2>
                        <p class="stat-label">Abonnés</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<script>
    $(document).ready(function() {
        loadAdminStats();
    });

    function loadAdminStats() {
        $.ajax({
            url: '/admin/api/dashboard',
            method: 'GET',
            success: function(data) {
                if (data) {
                    $('#adminTotalUsers').text(data.totalUsers || 0);
                    $('#adminTotalAdmins').text(data.admins || 0);
                    $('#adminTotalAgents').text(data.agents || 0);
                    $('#adminTotalAbonnes').text(data.abonnes || 0);
                }
            }
        });
    }
</script>
</body>
</html>
