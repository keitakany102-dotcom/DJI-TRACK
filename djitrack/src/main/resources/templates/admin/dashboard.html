<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/header :: header('Admin - Tableau de bord')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="main-wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <main>
        <div class="page-header fade-up">
            <div>
                <h1 class="page-title"><i class="bi bi-speedometer2"></i> Tableau de bord</h1>
                <div class="breadcrumb-custom">
                    <i class="bi bi-house"></i> Accueil &rsaquo; Administration
                </div>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-download"></i> Exporter
                </button>
                <button class="btn btn-primary btn-sm">
                    <i class="bi bi-arrow-clockwise"></i> Actualiser
                </button>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3 fade-up delay-1">
                <div class="stat-card stat-primary">
                    <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
                    <div class="stat-label">Abonnés</div>
                    <div class="stat-value" th:text="${nbAbonnes}">0</div>
                    <div class="stat-trend"><i class="bi bi-arrow-up-short"></i> Clients actifs</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3 fade-up delay-2">
                <div class="stat-card stat-success">
                    <div class="stat-icon"><i class="bi bi-receipt"></i></div>
                    <div class="stat-label">Factures</div>
                    <div class="stat-value" th:text="${nbFactures}">0</div>
                    <div class="stat-trend"><i class="bi bi-calendar3"></i> Ce mois</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3 fade-up delay-3">
                <div class="stat-card stat-danger">
                    <div class="stat-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
                    <div class="stat-label">Impayées</div>
                    <div class="stat-value" th:text="${nbImpayees}">0</div>
                    <div class="stat-trend"><i class="bi bi-exclamation-circle"></i> À recouvrer</div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3 fade-up delay-4">
                <div class="stat-card stat-warning">
                    <div class="stat-icon"><i class="bi bi-chat-dots-fill"></i></div>
                    <div class="stat-label">Réclamations</div>
                    <div class="stat-value" th:text="${nbReclamations}">0</div>
                    <div class="stat-trend"><i class="bi bi-clock"></i> En attente</div>
                </div>
            </div>
        </div>

        <!-- Graphiques -->
        <div class="row g-3">
            <div class="col-lg-8 fade-up">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="bi bi-bar-chart-line"></i> Évolution des consommations
                        <span class="ms-auto text-muted" style="font-size:0.78rem;font-weight:400;">12 derniers mois</span>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="chartConsommation"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4 fade-up delay-1">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="bi bi-pie-chart"></i> Répartition des clients
                    </div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <div class="chart-container" style="height:220px;">
                            <canvas id="chartClients"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script src="/js/dashboard-admin.js"></script>
</body>
</html>
