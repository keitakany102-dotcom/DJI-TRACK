<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Rapports')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="main-wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <main>
        <div class="page-header fade-up">
            <div>
                <h1 class="page-title"><i class="bi bi-file-earmark-bar-graph"></i> Rapports</h1>
                <div class="breadcrumb-custom"><i class="bi bi-house"></i> Admin &rsaquo; Rapports</div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-sm-6 col-xl-3 fade-up delay-1">
                <a th:href="@{/admin/rapports/recettes}" class="rapport-card">
                    <div class="rapport-icon" style="background:linear-gradient(135deg,#16a34a,#14532d);">
                        <i class="bi bi-cash-stack" style="color:#fff;"></i>
                    </div>
                    <h5>Recettes</h5>
                    <p class="text-muted mt-1 mb-0" style="font-size:0.8rem;">Revenus et encaissements</p>
                </a>
            </div>
            <div class="col-sm-6 col-xl-3 fade-up delay-2">
                <a th:href="@{/admin/rapports/factures}" class="rapport-card">
                    <div class="rapport-icon" style="background:linear-gradient(135deg,#2563eb,#1e40af);">
                        <i class="bi bi-receipt" style="color:#fff;"></i>
                    </div>
                    <h5>Factures</h5>
                    <p class="text-muted mt-1 mb-0" style="font-size:0.8rem;">État de la facturation</p>
                </a>
            </div>
            <div class="col-sm-6 col-xl-3 fade-up delay-3">
                <a th:href="@{/admin/rapports/consommation}" class="rapport-card">
                    <div class="rapport-icon" style="background:linear-gradient(135deg,#0891b2,#164e63);">
                        <i class="bi bi-droplet" style="color:#fff;"></i>
                    </div>
                    <h5>Consommation</h5>
                    <p class="text-muted mt-1 mb-0" style="font-size:0.8rem;">Volumes consommés</p>
                </a>
            </div>
            <div class="col-sm-6 col-xl-3 fade-up delay-4">
                <a th:href="@{/admin/rapports/impayes}" class="rapport-card">
                    <div class="rapport-icon" style="background:linear-gradient(135deg,#dc2626,#7f1d1d);">
                        <i class="bi bi-exclamation-triangle" style="color:#fff;"></i>
                    </div>
                    <h5>Impayés</h5>
                    <p class="text-muted mt-1 mb-0" style="font-size:0.8rem;">Factures non réglées</p>
                </a>
            </div>
        </div>
    </main>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
