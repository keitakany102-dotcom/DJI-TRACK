<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Utilisateur - Formulaire')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="main-wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <main>
        <div class="page-header fade-up">
            <div>
                <h1 class="page-title"><i class="bi bi-person-plus"></i> Nouvel utilisateur</h1>
                <div class="breadcrumb-custom"><i class="bi bi-house"></i> Admin &rsaquo; Utilisateurs &rsaquo; Nouveau</div>
            </div>
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div th:if="${error}" class="alert alert-danger fade-up">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <div class="card fade-up" style="max-width:640px;">
            <div class="card-header">
                <i class="bi bi-person-badge"></i> Informations de l'utilisateur
            </div>
            <div class="card-body">
                <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nom *</label>
                            <input type="text" th:field="*{nom}" class="form-control" placeholder="Nom de famille" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Prénom *</label>
                            <input type="text" th:field="*{prenom}" class="form-control" placeholder="Prénom" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Nom d'utilisateur *</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="Identifiant" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="email@exemple.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Mot de passe *</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Rôle *</label>
                            <select name="role" class="form-select" required>
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save"></i> Enregistrer
                        </button>
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
