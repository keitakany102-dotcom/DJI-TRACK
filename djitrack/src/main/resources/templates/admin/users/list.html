<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header('Utilisateurs')"></head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<div class="main-wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <main>
        <div class="page-header fade-up">
            <div>
                <h1 class="page-title"><i class="bi bi-person-badge"></i> Utilisateurs</h1>
                <div class="breadcrumb-custom"><i class="bi bi-house"></i> Admin &rsaquo; Utilisateurs</div>
            </div>
            <a th:href="@{/admin/users/create}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Nouvel utilisateur
            </a>
        </div>

        <div class="table-card fade-up">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Utilisateur</th>
                        <th>Email</th>
                        <th>Rôle</th>
                        <th>Statut</th>
                        <th style="width:100px;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td class="text-muted" style="font-size:0.8rem;" th:text="'#' + ${u.id}"></td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <div class="avatar-circle" style="width:36px;height:36px;flex-shrink:0;font-size:0.85rem;">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <div>
                                    <div class="fw-600" th:text="${u.nom + ' ' + u.prenom}"></div>
                                    <div class="text-muted" style="font-size:0.78rem;" th:text="'@' + ${u.username}"></div>
                                </div>
                            </div>
                        </td>
                        <td class="text-muted" th:text="${u.email}"></td>
                        <td><span class="badge badge-role" th:text="${u.role}"></span></td>
                        <td>
                            <span th:if="${u.enabled}" class="badge badge-status-active">
                                <i class="bi bi-circle-fill me-1" style="font-size:0.5rem;"></i> Actif
                            </span>
                            <span th:unless="${u.enabled}" class="badge badge-status-inactive">
                                <i class="bi bi-circle-fill me-1" style="font-size:0.5rem;"></i> Désactivé
                            </span>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}" class="btn btn-icon btn-primary btn-sm" title="Modifier">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/admin/users/delete/{id}(id=${u.id})}" class="btn btn-icon btn-danger btn-sm" title="Désactiver"
                                   onclick="return confirm('Désactiver cet utilisateur ?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
